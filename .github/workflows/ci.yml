name: CI (front)

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-front-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    name: Tipos y build (tsc + next build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # El repo trae .npmrc con legacy-peer-deps=true (React 19).
      - name: Instalar dependencias
        run: npm ci
      - name: Revisar tipos
        run: npx tsc --noEmit
      - name: Build de produccion
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8081
