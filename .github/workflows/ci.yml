name: CI (front)

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-front-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    name: Tipos y build (tsc + next build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      # El repo trae .npmrc con legacy-peer-deps=true (React 19).
      - name: Instalar dependencias
        run: npm ci
      - name: Auditoria de dependencias (bloquea solo criticas)
        run: |
          # Las criticas de las dependencias de produccion bloquean el CI.
          npm audit --omit=dev --audit-level=critical
      - name: Auditoria de dependencias (informe completo, no bloquea)
        run: npm audit || true
      - name: Revisar tipos
        run: npx tsc --noEmit
      - name: Build de produccion
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8081

  # TST-01: lint y pruebas en un trabajo APARTE (corre en paralelo y no depende de que tsc/build pasen).
  calidad:
    name: Lint y pruebas (eslint + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      # 0 errores y como maximo los avisos que ya existian: no se puede anadir ninguno nuevo (solo bajar este numero).
      # Si una tarea necesita de verdad un aviso mas, se sube el numero a proposito en esta linea.
      - name: Lint
        run: npm run lint -- --max-warnings 144
      - name: Pruebas
        run: npm test
