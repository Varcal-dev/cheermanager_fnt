# Actualizaciones semanales agrupadas: un PR por ecosistema, no uno por paquete.
# Las versiones mayores (zod 4, next 16...) llegan como PR aparte; se revisan con plan, no se unen a ciegas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      menores-y-parches:
        update-types: [minor, patch]
    # zod 4 rompio el build (tipos de z.coerce y la opcion errorMap eliminada): se migra con plan y pruebas de los
    # formularios, no con un PR automatico. Las subidas menores y parches de zod 3 siguen entrando agrupadas.
    ignore:
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    groups:
      acciones:
        patterns: ["*"]
