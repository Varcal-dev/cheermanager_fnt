<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiero unirme al club</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#faf7f8; --fg:#1d1a1b; --muted:#6b6264; --card:#fff; --line:#e4dcde; --brand:#7a1f3d; --brand-fg:#fff; --err:#b3261e; --ok:#1b6b3a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161213; --fg:#f3eeef; --muted:#a79c9f; --card:#211b1d; --line:#3a3033; --brand:#c25a7c; --brand-fg:#161213; --err:#ff8a80; --ok:#7bd89a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  form, .caja { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  label { display:block; font-weight:600; margin:14px 0 4px; font-size:.95rem; }
  input, select, textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:inherit; }
  textarea { min-height:80px; resize:vertical; }
  .fila { display:grid; grid-template-columns:1fr; gap:0 12px; }
  @media (min-width:520px) { .fila { grid-template-columns:1fr 1fr; } }
  .check { display:flex; gap:10px; align-items:flex-start; margin-top:18px; font-weight:400; }
  .check input { width:auto; margin-top:4px; }
  button { margin-top:20px; width:100%; padding:12px; border:0; border-radius:8px; background:var(--brand); color:var(--brand-fg); font:inherit; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .msg { margin-top:14px; font-weight:600; }
  .err { color:var(--err); } .ok { color:var(--ok); }
  .trampa { position:absolute; left:-9999px; height:0; overflow:hidden; }
  small { color:var(--muted); display:block; margin-top:4px; }
  a { color:var(--brand); }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Quiero unirme</h1>
  <p class="sub">Déjanos tus datos y el club te contactará. Es solo una solicitud: no genera cobros.</p>

  <div id="sinclub" class="caja" hidden>Este enlace no es válido. Pídele al club su enlace de pre-inscripción.</div>

  <form id="form" novalidate hidden>
    <label for="tipo">¿Qué quieres?</label>
    <select id="tipo">
      <option value="CLASE_PRUEBA">Una clase de prueba</option>
      <option value="INSCRIPCION">Inscribirme</option>
      <option value="LISTA_ESPERA">Entrar a la lista de espera</option>
    </select>

    <label for="contactoNombre">Tu nombre (acudiente o deportista mayor de edad)</label>
    <input id="contactoNombre" maxlength="120" autocomplete="name">
    <div class="fila">
      <div><label for="contactoCorreo">Correo</label><input id="contactoCorreo" type="email" maxlength="150" autocomplete="email"></div>
      <div><label for="contactoTelefono">Teléfono / WhatsApp</label><input id="contactoTelefono" type="tel" maxlength="30" autocomplete="tel"></div>
    </div>
    <div class="fila">
      <div><label for="deportistaNombre">Nombre del deportista</label><input id="deportistaNombre" maxlength="120"></div>
      <div><label for="deportistaNacimiento">Fecha de nacimiento</label><input id="deportistaNacimiento" type="date"></div>
    </div>
    <label for="experiencia">Experiencia previa (opcional)</label>
    <input id="experiencia" maxlength="300" placeholder="Gimnasia, porrismo, otro deporte…">
    <label for="mensaje">Mensaje (opcional)</label>
    <textarea id="mensaje" maxlength="500"></textarea>

    <div class="trampa" aria-hidden="true"><label>No llenar<input id="website" tabindex="-1" autocomplete="off"></label></div>

    <label class="check"><input type="checkbox" id="consentimiento">
      <span>Autorizo al club a tratar los datos que dejo aquí (míos y del deportista, que puede ser menor de edad) únicamente para contactarme sobre mi solicitud. Lo leí en la <a id="politica" href="#" target="_blank" rel="noopener">política de tratamiento de datos</a>.</span>
    </label>
    <button id="enviar" type="submit">Enviar solicitud</button>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </form>
</main>

<script>
  // ---- CONFIGURACION (se edita una sola vez) ----
  var API_BASE = "https://api.TU-DOMINIO.com";          // URL del back, sin barra final
  var POLITICA_URL = "";                                  // enlace publico a la politica de datos
  var VERSION_CONSENTIMIENTO = "2026-11";                 // debe coincidir con LegalService en el back
  // -----------------------------------------------

  var slug = (new URLSearchParams(location.search).get("club") || "").trim().toLowerCase();
  var $ = function (id) { return document.getElementById(id); };
  if (!/^[a-z0-9-]{2,60}$/.test(slug)) { $("sinclub").hidden = false; }
  else { $("form").hidden = false; if (POLITICA_URL) $("politica").href = POLITICA_URL; }

  function msg(texto, ok) { var m = $("msg"); m.textContent = texto; m.className = "msg " + (ok ? "ok" : "err"); }

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!$("consentimiento").checked) { msg("Debes autorizar el tratamiento de los datos para continuar.", false); return; }
    var body = {
      tipo: $("tipo").value, contactoNombre: $("contactoNombre").value, contactoCorreo: $("contactoCorreo").value,
      contactoTelefono: $("contactoTelefono").value, deportistaNombre: $("deportistaNombre").value,
      deportistaNacimiento: $("deportistaNacimiento").value, experiencia: $("experiencia").value, mensaje: $("mensaje").value,
      consentimiento: true, versionConsentimiento: VERSION_CONSENTIMIENTO, website: $("website").value
    };
    $("enviar").disabled = true; msg("Enviando…", true);
    fetch(API_BASE + "/api/public/clubes/" + encodeURIComponent(slug) + "/interesados", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; });
    }).then(function (x) {
      if (x.ok) { $("form").reset(); msg("¡Listo! Recibimos tu solicitud. El club te contactará pronto.", true); }
      else { msg((x.d && x.d.message) || "No pudimos enviar la solicitud. Inténtalo de nuevo.", false); }
    }).catch(function () { msg("No hay conexión con el servidor. Inténtalo de nuevo.", false); })
      .then(function () { $("enviar").disabled = false; });
  });
</script>
</body>
</html>
